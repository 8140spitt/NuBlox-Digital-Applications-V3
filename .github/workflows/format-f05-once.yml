name: One-time F05 formatting

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-f05-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Run F05 formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - working-directory: app
        run: pnpm install --frozen-lockfile
      - working-directory: app
        shell: bash
        run: |
          pnpm exec prettier --write             migrations/README.md             README.md             src/lib/components/brand/MarketingHero.svelte             src/lib/server/product-innovation.test.ts             src/lib/server/product-innovation.ts             src/lib/workspaces/f05.ts             'src/routes/[tenant]/app/functions/f05/business-cases/+page.server.ts'             'src/routes/[tenant]/app/functions/f05/business-cases/+page.svelte'             'src/routes/[tenant]/app/functions/f05/configuration/+page.server.ts'             'src/routes/[tenant]/app/functions/f05/configuration/+page.svelte'             'src/routes/[tenant]/app/functions/f05/ideation/+page.server.ts'             'src/routes/[tenant]/app/functions/f05/ideation/+page.svelte'             'src/routes/[tenant]/app/functions/f05/launch-management/+page.server.ts'             'src/routes/[tenant]/app/functions/f05/launch-management/+page.svelte'             'src/routes/[tenant]/app/functions/f05/lifecycle/+page.server.ts'             'src/routes/[tenant]/app/functions/f05/lifecycle/+page.svelte'             'src/routes/[tenant]/app/functions/f05/market-needs/+page.server.ts'             'src/routes/[tenant]/app/functions/f05/market-needs/+page.svelte'             src/routes/web/+page.svelte
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git rm .github/workflows/format-f05-once.yml
          git commit -m "Format F05 operational baseline"
          git push origin HEAD:main
