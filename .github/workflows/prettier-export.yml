name: Temporary Prettier Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prettier-export.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format target files
        run: |
          pnpm exec prettier --write \
            src/lib/components/CollectionView.svelte \
            src/lib/components/CommandPalette.svelte \
            src/lib/components/ContextBar.svelte \
            src/lib/server/interaction-preferences.ts \
            src/lib/server/marketing-lead.ts \
            'src/routes/[tenant]/app/+layout.server.ts' \
            'src/routes/[tenant]/app/objects/[objectType]/[objectId]/+page.server.ts' \
            'src/routes/[tenant]/app/search/+page.svelte'

      - name: Export formatted files
        run: |
          files=(
            "src/lib/components/CollectionView.svelte"
            "src/lib/components/CommandPalette.svelte"
            "src/lib/components/ContextBar.svelte"
            "src/lib/server/interaction-preferences.ts"
            "src/lib/server/marketing-lead.ts"
            "src/routes/[tenant]/app/+layout.server.ts"
            "src/routes/[tenant]/app/objects/[objectType]/[objectId]/+page.server.ts"
            "src/routes/[tenant]/app/search/+page.svelte"
          )
          for file in "${files[@]}"; do
            echo "@@FILE:$file@@"
            base64 -w0 "$file"
            echo
            echo "@@END@@"
          done
