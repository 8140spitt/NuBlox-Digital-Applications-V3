name: One-shot Deliverable formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-managed-deliverable.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format changed application files
        run: |
          pnpm exec prettier --write             src/lib/server/managed-deliverable.ts             src/lib/server/managed-deliverable.test.ts             src/lib/server/platform-context.ts             src/lib/server/db.ts             'src/routes/[tenant]/app/deliverables/+page.server.ts'             'src/routes/[tenant]/app/deliverables/+page.svelte'             scripts/db-seed-platform.ts

      - name: Commit formatter output
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Format managed deliverable governance slice"
          git push origin HEAD:main
