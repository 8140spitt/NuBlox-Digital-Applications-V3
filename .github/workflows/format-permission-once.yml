name: One-time permission UX formatting

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-permission-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Run permission UX formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - working-directory: app
        run: pnpm install --frozen-lockfile
      - working-directory: app
        run: pnpm exec prettier --write 'src/routes/[tenant]/app/+error.svelte'
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/routes/'[tenant]'/app/+error.svelte
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format permission denied state"
          git push origin HEAD:main
