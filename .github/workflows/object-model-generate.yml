name: Generate Business Object Register

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-business-object-register.mjs'
      - 'scripts/export-business-object-register-for-app.mjs'
      - '.github/workflows/object-model-generate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate register
        run: |
          node scripts/generate-business-object-register.mjs
          node scripts/export-business-object-register-for-app.mjs

      - name: Commit generated register
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data-model/canonical-business-object-register.csv \
                  docs/data-model/canonical-business-object-duplicates.csv \
                  docs/data-model/canonical-business-object-summary.md \
                  app/src/lib/generated/business-object-register.json
          if git diff --cached --quiet; then
            echo "Generated register already current"
          else
            git commit -m "build: generate canonical business object data"
            git push origin HEAD:main
          fi
