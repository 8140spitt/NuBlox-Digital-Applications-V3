name: App CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nublox_v3_test
          MYSQL_USER: nublox
          MYSQL_PASSWORD: nublox
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NUBLOX_TEST_DATABASE_URL: mysql://nublox:nublox@127.0.0.1:3306/nublox_v3_test
      NUBLOX_TEST_ADMIN_DATABASE_URL: mysql://root:root@127.0.0.1:3306/nublox_v3_test

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate migration architecture
        run: pnpm db:validate

      - name: Apply test database migrations
        run: pnpm db:migrate:test

      - name: Verify migration ledger
        run: pnpm db:status:test

      - name: Clean-database migration and service tests
        run: pnpm test:migrations

      - name: Domain and architecture tests
        run: pnpm test:domain

      - name: Type and Svelte check
        run: pnpm check

      - name: Formatting check
        run: pnpm format:check

      - name: Production build
        run: pnpm build
