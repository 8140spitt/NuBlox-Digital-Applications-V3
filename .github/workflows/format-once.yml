name: One-shot formatter

on:
  push:
    paths:
      - '.github/workflows/format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: app
        run: pnpm install --no-frozen-lockfile

      - name: Format application
        working-directory: app
        run: pnpm format

      - name: Commit formatter output
        run: |
          git config user.name "NuBlox CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No formatter changes required."
          else
            git commit -m "Format functional deployment and deliverable runtime"
            git push origin HEAD:main
          fi
