name: One-time F04 Prettier cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-f04-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Run one-time F04 Prettier cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        working-directory: app
        run: pnpm format
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Format F04 corporate development implementation"
          git push origin HEAD:main
